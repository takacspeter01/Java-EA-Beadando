<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>Forex - Pozíció zárása</title>
    <link rel="stylesheet" href="/assets/css/main.css">
    <style>
        select,
        select option,
        input[type="number"],
        input[type="date"] {
            color: #111111 !important;
            background-color: #ffffff !important;
            -webkit-text-fill-color: #111111 !important;
        }

        select:focus,
        input[type="number"]:focus {
            color: #111111 !important;
            background-color: #ffffff !important;
        }
    </style>
</head>
<body style="padding: 40px;">

<h1>Forex - Pozíció zárása</h1>

<form action="/forex_zar" method="post">

    <label for="tradeId">Trade ID:</label>
    <input type="number"
           name="tradeId"
           id="tradeId"
           min="1"
           step="1"
           required>

    <button type="submit"
            onclick="return confirm(
          'Biztosan lezárod a DEMO pozíciót?')">
        Pozíció zárása
    </button>
</form>

<p th:if="${uzenet}" th:text="${uzenet}"></p>

<a href="/forex_poz">Nyitott pozíciók</a>
<br>
<a href="/">Vissza a főoldalra</a>

</body>
</html>
